name: Build libisar Linux x64 (GLIBC 2.36)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:12
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y \
            curl \
            build-essential \
            pkg-config \
            libssl-dev \
            git \
            python3 \
            bash \
            clang \
            libclang-dev \
            llvm-dev

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y

      - name: Build libisar
        run: |
          . "$HOME/.cargo/env"
          cargo build --release --manifest-path packages/isar_core_ffi/Cargo.toml

      - name: Find and verify output
        run: |
          find target/release -name "*.so" -ls
          cp target/release/libisar.so libisar_linux_x64_glibc236.so
          echo "✓ Build complete"
          ldd libisar_linux_x64_glibc236.so | grep GLIBC | sort -V | tail -1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libisar-linux-x64-debian12
          path: libisar_linux_x64_glibc236.so

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: libisar_linux_x64_glibc236.so
          name: libisar Linux x64 GLIBC 2.36
          body: |
            libisar.so built on Debian 12 (Bookworm) — GLIBC 2.36
            Compatible with: Debian 12+, Ubuntu 22.04+, and any Linux with GLIBC 2.36+
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
