name: Build libisar Linux x64

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-debian11:
    name: Debian 11 (GLIBC 2.31)
    runs-on: ubuntu-latest
    container:
      image: debian:11
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y \
            curl \
            build-essential \
            pkg-config \
            libssl-dev \
            git \
            python3 \
            bash \
            clang \
            libclang-dev \
            llvm-dev

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y

      - name: Build libisar
        run: |
          . "$HOME/.cargo/env"
          cargo build --release --manifest-path packages/isar_core_ffi/Cargo.toml

      - name: Verify and copy output
        run: |
          cp target/release/libisar.so libisar_linux_x64_glibc231.so
          ls -lh libisar_linux_x64_glibc231.so
          echo "✓ Build complete"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libisar-linux-x64-debian11
          path: libisar_linux_x64_glibc231.so

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: libisar_linux_x64_glibc231.so
          name: libisar Linux x64 GLIBC 2.31
          body: |
            libisar.so built on Debian 11 (Bullseye) — GLIBC 2.31
            Compatible with: Debian 11+, Ubuntu 20.04+, Linux Mint 20+
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
